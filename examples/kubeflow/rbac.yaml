# Lets Kubeflow Pipelines steps (ServiceAccount pipeline-runner in namespace kubeflow) create SiliconJobs there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: siliconjob-runner, namespace: kubeflow }
rules:
  - apiGroups: [kubesilicon.io]
    resources: [siliconjobs]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: siliconjob-runner, namespace: kubeflow }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: siliconjob-runner }
subjects:
  - { kind: ServiceAccount, name: pipeline-runner, namespace: kubeflow }
