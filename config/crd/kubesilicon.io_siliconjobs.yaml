apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: siliconjobs.kubesilicon.io
spec:
  group: kubesilicon.io
  scope: Namespaced
  names: { kind: SiliconJob, listKind: SiliconJobList, plural: siliconjobs, singular: siliconjob, shortNames: [sjob] }
  versions:
    - name: v1
      served: true
      storage: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Message, type: string, jsonPath: .status.message }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - { rule: "(has(self.script) && size(self.script) > 0) || (has(self.command) && size(self.command) > 0)", message: "script or command is required" }
                - { rule: "has(self.python) == has(oldSelf.python) && (!has(self.python) || self.python == oldSelf.python)", message: "spec.python cannot change after creation; only spec.running can" }
                - { rule: "has(self.dependencies) == has(oldSelf.dependencies) && (!has(self.dependencies) || self.dependencies == oldSelf.dependencies)", message: "spec.dependencies cannot change after creation; only spec.running can" }
                - { rule: "has(self.script) == has(oldSelf.script) && (!has(self.script) || self.script == oldSelf.script)", message: "spec.script cannot change after creation; only spec.running can" }
                - { rule: "has(self.command) == has(oldSelf.command) && (!has(self.command) || self.command == oldSelf.command)", message: "spec.command cannot change after creation; only spec.running can" }
                - { rule: "has(self.timeoutSeconds) == has(oldSelf.timeoutSeconds) && (!has(self.timeoutSeconds) || self.timeoutSeconds == oldSelf.timeoutSeconds)", message: "spec.timeoutSeconds cannot change after creation; only spec.running can" }
                - { rule: "has(self.memory) == has(oldSelf.memory) && (!has(self.memory) || self.memory == oldSelf.memory)", message: "spec.memory cannot change after creation; only spec.running can" }
                - { rule: "has(self.backoffLimit) == has(oldSelf.backoffLimit) && (!has(self.backoffLimit) || self.backoffLimit == oldSelf.backoffLimit)", message: "spec.backoffLimit cannot change after creation; only spec.running can" }
                - { rule: "has(self.inputs) == has(oldSelf.inputs) && (!has(self.inputs) || self.inputs == oldSelf.inputs)", message: "spec.inputs cannot change after creation; only spec.running can" }
                - { rule: "has(self.outputs) == has(oldSelf.outputs) && (!has(self.outputs) || self.outputs == oldSelf.outputs)", message: "spec.outputs cannot change after creation; only spec.running can" }
              properties:
                running: { type: boolean, default: true, description: "false cancels the job" }
                python: { type: string, default: "3.12", pattern: '^3\.\d+(\.\d+)?$', description: "Python version, not a path" }
                dependencies:
                  type: array
                  items: { type: string, pattern: "^[A-Za-z0-9]" }
                  description: "pip requirements, binary wheels only (no sdist builds)"
                script: { type: string, description: "inline Python, runs as script.py (alternative to command)" }
                command:
                  type: array
                  items: { type: string }
                  description: "argv run in the job work dir; 'python' resolves to the job venv"
                timeoutSeconds: { type: integer, minimum: 1, default: 3600 }
                memory: { type: string, description: "e.g. 4Gi: memory (CPU and GPU, they are the same on Apple Silicon) the job may use. With it, the job runs next to others when that much is available and is killed if it uses more. Without it, the job runs alone, with no limit" }
                backoffLimit: { type: integer, minimum: 0, default: 2, description: "retries when the runner is interrupted without a result (Mac reboot, kill); script failures are not retried" }
                inputs:
                  type: array
                  items:
                    type: object
                    required: [url, path]
                    properties:
                      url: { type: string, description: "http(s) URL, downloaded (GET) before the job" }
                      path: { type: string, description: "relative path inside the work dir" }
                outputs:
                  type: array
                  items:
                    type: object
                    required: [url, path]
                    properties:
                      url: { type: string, description: "http(s) URL (presigned), the file is uploaded (PUT) after the job" }
                      path: { type: string, description: "relative path inside the work dir" }
            status:
              type: object
              properties:
                phase: { type: string }
                message: { type: string }
                logTail: { type: string, description: "last 4 KiB of the job log" }
                attempts: { type: integer, description: "times the runner was interrupted and restarted" }
                startTime: { type: string, format: date-time, description: "when the job went Running" }
                completionTime: { type: string, format: date-time, description: "when the job reached Succeeded, Failed or Cancelled" }
                exitCode: { type: integer, description: "exit code of the script, set when one exists" }
