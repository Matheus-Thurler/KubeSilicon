apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: siliconjobs.kubesilicon.io
spec:
  group: kubesilicon.io
  scope: Namespaced
  names: { kind: SiliconJob, listKind: SiliconJobList, plural: siliconjobs, singular: siliconjob, shortNames: [sjob] }
  versions:
    - name: v1
      served: true
      storage: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Message, type: string, jsonPath: .status.message }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                running: { type: boolean, default: true, description: "false cancels the job" }
                python: { type: string, default: "3.12", pattern: '^3\.\d+(\.\d+)?$', description: "Python version, not a path" }
                dependencies:
                  type: array
                  items: { type: string, pattern: "^[A-Za-z0-9]" }
                  description: "pip requirements, binary wheels only (no sdist builds)"
                script: { type: string, description: "inline Python, runs as script.py (alternative to command)" }
                command:
                  type: array
                  items: { type: string }
                  description: "argv run in the job work dir; 'python' resolves to the job venv"
                timeoutSeconds: { type: integer, minimum: 1, default: 3600 }
                backoffLimit: { type: integer, minimum: 0, default: 2, description: "retries when the runner is interrupted without a result (Mac reboot, kill); script failures are not retried" }
                inputs:
                  type: array
                  items:
                    type: object
                    required: [url, path]
                    properties:
                      url: { type: string, description: "http(s) URL, downloaded (GET) before the job" }
                      path: { type: string, description: "relative path inside the work dir" }
                outputs:
                  type: array
                  items:
                    type: object
                    required: [url, path]
                    properties:
                      url: { type: string, description: "http(s) URL (presigned), the file is uploaded (PUT) after the job" }
                      path: { type: string, description: "relative path inside the work dir" }
            status:
              type: object
              properties:
                phase: { type: string }
                message: { type: string }
                logTail: { type: string, description: "last 4 KiB of the job log" }
                attempts: { type: integer, description: "times the runner was interrupted and restarted" }
