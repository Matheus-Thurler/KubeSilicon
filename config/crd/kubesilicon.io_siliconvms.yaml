apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: siliconvms.kubesilicon.io
spec:
  group: kubesilicon.io
  scope: Namespaced
  names: { kind: SiliconVM, listKind: SiliconVMList, plural: siliconvms, singular: siliconvm, shortNames: [svm] }
  versions:
    - name: v1
      served: true
      storage: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Ready, type: string, jsonPath: '.status.conditions[?(@.type=="Ready")].status' }
        - { name: IP, type: string, jsonPath: .status.ip }
        - { name: CPU, type: integer, jsonPath: .spec.cpu }
        - { name: Memory, type: string, jsonPath: .spec.memory }
        - { name: Restarts, type: integer, jsonPath: .status.restartCount, priority: 1 }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [disk]
              properties:
                running: { type: boolean, default: true }
                cpu: { type: integer, minimum: 1, default: 2 }
                memory: { type: string, default: 2Gi }
                restartPolicy: { type: string, enum: [Never, OnFailure, Always], default: Never, description: "what to do when the VM is down while running is true: OnFailure restarts after a crash, Always also after the guest shuts itself down" }
                readinessPort: { type: integer, minimum: 1, maximum: 65535, default: 22, description: "the Ready condition is True while the guest accepts TCP connections on this port" }
                nestedVirtualization: { type: boolean, default: false, description: "expose /dev/kvm to the guest (M3 or newer, macOS 15 or newer)" }
                disk:
                  type: object
                  required: [source]
                  properties:
                    source: { type: string, minLength: 1, description: "http(s) URL, or a file under ~/.kubesilicon/images on the Mac (self-contained qcow2 or raw)" }
                    sha256: { type: string, pattern: "^[0-9a-fA-F]{64}$", description: "expected SHA-256 of the downloaded image (http(s) sources)" }
                    size: { type: string, description: "e.g. 20Gi; can only grow" }
                cloudInit:
                  type: object
                  properties:
                    userData: { type: string }
            status:
              type: object
              properties:
                phase: { type: string }
                ip: { type: string }
                message: { type: string }
                restartCount: { type: integer, description: "times restartPolicy started the VM again" }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
