apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: siliconvms.kubesilicon.io
spec:
  group: kubesilicon.io
  scope: Namespaced
  names: { kind: SiliconVM, listKind: SiliconVMList, plural: siliconvms, singular: siliconvm, shortNames: [svm] }
  versions:
    - name: v1
      served: true
      storage: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: IP, type: string, jsonPath: .status.ip }
        - { name: CPU, type: integer, jsonPath: .spec.cpu }
        - { name: Memory, type: string, jsonPath: .spec.memory }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [disk]
              properties:
                running: { type: boolean, default: true }
                cpu: { type: integer, minimum: 1, default: 2 }
                memory: { type: string, default: 2Gi }
                disk:
                  type: object
                  required: [source]
                  properties:
                    source: { type: string, minLength: 1, description: "http(s) URL or local path (qcow2 or raw)" }
                    size: { type: string, description: "e.g. 20Gi; can only grow" }
                cloudInit:
                  type: object
                  properties:
                    userData: { type: string }
            status:
              type: object
              properties:
                phase: { type: string }
                ip: { type: string }
                message: { type: string }
